    en: [stroke management appointment]
    el: [stroke management appointment]
    cs: [stroke management appointment]
  descriptions:
    en: Recommendation on discharge to see a cerebrovascular expert for stroke management.
    es: Recomendación al alta de acudir a un especialista en enfermedad cerebrovascular para el manejo del ictus.
    el: Σύσταση κατά το εξιτήριο για επίσκεψη σε ειδικό αγγειακών εγκεφαλικών επεισοδίων για τη διαχείριση του εγκεφαλικού.
    cs: Doporučení při propuštění k návštěvě cerebrovaskulárního specialisty kvůli další léčbě iktu.
  data_type: Enum
  Enum:
    - key: scheduled
      synonyms:
        en: [scheduled]
        el: [προγραμματισμένο]
        cs: [naplánováno]
    - key: not_scheduled
      synonyms:
        en: [not scheduled]
        el: [μη προγραμματισμένο]
        cs: [nenaplánováno]
    - key: not_recommended
      synonyms:
        en: [not recommended]
        el: [δεν συνιστάται]
        cs: [nedoporučeno]
- canonical: THREE_MONTH_MRS
  synonyms:
    en: [three-month Modified Rankin Scale, three-month mrs, 3-month mrs]
    el: [τριών μηνών τροποποιημένη κλίμακα rankin, τριών μηνών mrs, 3-month mrs]
    cs: [tříměsíční škála modified rankin, tříměsíční mrs, 3-month mrs]
  descriptions:
    en: Modified Rankin Scale score taken three months after stroke onset.
    es: Puntuación de la escala de Rankin modificada registrada a los tres meses del inicio del ictus.
    el: Βαθμολογία στην τροποποιημένη κλίμακα Rankin τρεις μήνες μετά την έναρξη του εγκεφαλικού επεισοδίου.
    cs: Skóre na škále Modified Rankin zaznamenané tři měsíce po vzniku iktu.
  data_type: Numeric
  statistics_enum: THREE_M_MRS
  Numeric:
    unit: score
    range_min: 0
    range_max: 6
    default_buckets: 6
- canonical: HOSPITAL_STAY
  synonyms:
    en: [length of hospital stay]
    el: [διάρκεια νοσηλείας]
    cs: [délka hospitalizace]
  descriptions:
    en: Length of hospitalization.
    es: Duración de la estancia hospitalaria.
    el: Διάρκεια νοσηλείας στο νοσοκομείο.
    cs: Délka hospitalizace.
  data_type: Numeric
  statistics_enum: DOOR_TO_DISCHARGE
  Numeric:
    unit: days
    range_min: 0
    range_max: 365
    default_buckets: 20
- canonical: DISCHARGE_NIHSS
  synonyms:
    en: [discharge NIH Stroke Scale, discharge NIHSS]
    el: [discharge nih stroke scale, nihss εξιτηρίου]
    cs: [discharge nih stroke scale, nihss při propuštění]
  descriptions:
    en: NIH Stroke Scale scores taken at discharge.
    es: Puntuaciones de la NIH Stroke Scale registradas al alta.
    el: Βαθμολογίες NIH Stroke Scale που λαμβάνονται κατά το εξιτήριο.
    cs: Hodnoty NIH Stroke Scale zaznamenané při propuštění.
  data_type: Numeric
  statistics_enum: DISCHARGE_NIHSS
  Numeric:
    unit: score
    range_min: 0
    range_max: 42
    default_buckets: 14
- canonical: DTI
  synonyms:
    en: [door to imaging, door to imaging time]
    el: [door to απεικόνιση, door to απεικόνιση time]
    cs: [door to zobrazení, door to zobrazení time]
  descriptions:
    en: Door-To-Imaging time in minutes.
    es: Tiempo puerta-imagen en minutos.
    el: Χρόνος door-to-imaging σε λεπτά.
    cs: Door-to-imaging čas v minutách.
  data_type: Numeric
  statistics_enum: DOOR_TO_IMAGING
  Numeric:
    unit: minutes
    range_min: 0
    range_max: 1440
    default_buckets: 24
- canonical: ONSET_TO_DOOR
  synonyms:
    en: [onset to door, time from onset to door]
    el: [έναρξη έως πόρτα, time from έναρξη έως πόρτα]
    cs: [začátek až dveře, time from začátek až dveře]
  descriptions:
    en: Time from stroke onset to the first door of treating hospital.
    es: Tiempo desde el inicio del ictus hasta la primera puerta del hospital tratante.
    el: Χρόνος από την έναρξη του εγκεφαλικού επεισοδίου έως την πρώτη πόρτα του θεράποντος νοσοκομείου.
    cs: Čas od začátku iktu k prvnímu dveřnímu kontaktu v léčící nemocnici.
  data_type: Numeric
  statistics_enum: ONSET_TO_DOOR
  Numeric:
    unit: minutes
    range_min: 0
    range_max: 1440
    default_buckets: 24
